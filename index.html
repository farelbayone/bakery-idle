<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Toko Roti Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f2429;--pn:#173a40;--pn2:#21505a;--tx:#fff8ee;--bt:#ffd36e;--pk:#ff6f91;--mt:#7ef0c6;--cr:#c47a3d;--dk:#2b1a0a}
*{box-sizing:border-box;margin:0}
body{font-family:Fredoka,ui-rounded,"Trebuchet MS",sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden;user-select:none}
header{display:flex;flex-wrap:wrap;gap:10px 18px;justify-content:space-between;align-items:center;padding:10px 20px;background:#0a181c;border-bottom:3px solid var(--pn2)}
h1{font-size:1.3rem;font-weight:700}
.st{display:flex;gap:16px;align-items:center;font-weight:600}
.chip{padding:4px 12px;border-radius:20px;background:var(--pn)}
.lv{min-width:120px}.pt{height:7px;margin:5px 0;border-radius:7px;background:#0007;overflow:hidden}
.pt i{display:block;height:100%;width:100%;background:var(--mt);transition:width .2s}.pt i.lo{background:var(--pk)}
.ib{width:38px;height:38px;margin-left:5px;border:0;border-radius:50%;background:var(--pn);color:inherit;font-size:1.05rem;cursor:pointer;transition:.2s}
.ib:hover{transform:rotate(12deg) scale(1.1);background:var(--pn2)}
button:focus-visible{outline:3px solid var(--bt);outline-offset:2px}
#hint{margin:12px 20px 0;padding:9px 14px;border-radius:14px;background:#ffd36e22;border:2px dashed var(--bt);font-size:.95rem}
main{display:grid;grid-template-columns:1fr 410px;gap:22px;max-width:1180px;margin:auto;padding:18px 20px}
#scene{position:relative;height:300px;border-radius:22px;overflow:hidden;border:4px solid var(--cr);background:#6ec3ff;transition:background 1s}
#sun{position:absolute;font-size:2.6rem;left:0;top:0;transition:transform 1s linear}
.cloud{position:absolute;font-size:2.4rem;opacity:.85;animation:drift 60s linear infinite}
#wall{position:absolute;left:0;right:0;bottom:0;height:62%;background:repeating-linear-gradient(90deg,#f6d9a8 0 56px,#efcd98 56px 58px);box-shadow:inset 0 10px 14px #0003}
.awn{position:absolute;top:0;left:0;right:0;height:46px;background:repeating-linear-gradient(90deg,var(--pk) 0 44px,#fff 44px 88px);filter:drop-shadow(0 5px 0 #0004);z-index:3}
.awn:after{content:"";position:absolute;left:0;right:0;bottom:-14px;height:16px;background:radial-gradient(circle at 22px 0,var(--pk) 21px,#0000 22px) 0 0/44px 16px repeat-x}
#sign{position:absolute;top:56px;left:50%;transform:translateX(-50%);padding:3px 18px;border-radius:12px;background:var(--dk);color:var(--bt);font-weight:700;border:3px solid var(--cr);z-index:3;white-space:nowrap}
#ev{position:absolute;top:56px;right:10px;z-index:4;padding:4px 12px;border-radius:14px;background:var(--pk);font-weight:700;animation:pulse 1s infinite}
#cus{position:absolute;left:8px;right:8px;bottom:46px;display:flex;gap:8px;align-items:flex-end;justify-content:center;z-index:2}
#cnt{position:absolute;left:0;right:0;bottom:0;height:48px;background:linear-gradient(#9a5b2c,#6b3a18);border-top:5px solid #c47a3d;z-index:4;display:flex;align-items:center;justify-content:center;gap:14px;font-size:1.4rem}
#cnt span{filter:drop-shadow(0 3px 0 #0005)}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:#4a2c10;font-weight:600}
.cu{position:relative;width:118px;padding:6px;border-radius:16px;background:#fffdf7ee;color:var(--dk);text-align:center;animation:walk .6s cubic-bezier(.2,1.4,.4,1)}
.cu.vip{background:#fff1b8;box-shadow:0 0 0 3px var(--bt),0 0 20px #ffd36e}
.cu .fc{font-size:2.3rem;animation:bob 1.6s ease-in-out infinite}
.cu.mad .fc{animation:shk .25s infinite}
.bb{margin:2px 0;padding:2px 6px;border-radius:10px;background:#fff;border:2px solid #0002;font-weight:700;font-size:.9rem;line-height:1.3}
.cu small{display:block;font-weight:600;color:#7a4a10}
.cu .pt{background:#0002}
.pri{padding:6px 12px;border:0;border-radius:12px;background:var(--bt);color:var(--dk);font:inherit;font-weight:700;cursor:pointer;box-shadow:0 3px 0 #b88a1e;transition:.12s}
.pri:hover:not(:disabled){transform:translateY(-2px)}.pri:active{transform:translateY(2px);box-shadow:none}
.pri:disabled{opacity:.45;cursor:not-allowed}
.out{animation:out .35s forwards}.bye{animation:bye .5s forwards}
h2{font-size:1.05rem;margin:16px 0 8px}
#ov{display:flex;flex-wrap:wrap;gap:10px}
.ov{width:112px;padding:10px 6px;border-radius:16px;background:#000a;text-align:center;font-size:.85rem;border:3px solid #333;cursor:pointer;transition:.15s}
.ov:hover{transform:translateY(-3px)}
.oe{display:block;font-size:2.1rem}
.ov.on{border-color:#ff8a3d;box-shadow:0 0 18px #ff8a3d66}.ov.on .oe{animation:bob .7s ease-in-out infinite}
.ov.dn{border-color:var(--mt);animation:pulse .6s infinite}.ov.bn{border-color:#888;opacity:.7}
.ov.kn{animation:sq .15s}
.tabs{display:flex;gap:5px;margin-bottom:10px}
.tab{flex:1;padding:8px 2px;border:0;border-radius:12px;background:var(--pn);color:inherit;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer}
.tab.on{background:var(--bt);color:var(--dk)}
.panel{display:none;max-height:640px;overflow:auto;padding-right:4px}.panel.on{display:block}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;width:100%;margin-bottom:7px;padding:9px;border:2px solid transparent;border-radius:14px;background:var(--pn);color:inherit;font:inherit;text-align:left;opacity:.55;cursor:pointer;transition:.15s}
.row.ok{opacity:1;border-color:var(--bt)}.row.ok:hover{transform:translateX(-4px);background:var(--pn2)}.row.lock{opacity:.3;cursor:not-allowed}
.row .ic{font-size:1.9rem;text-align:center}.row small{display:block;opacity:.75;font-size:.78rem}
.cost{font-weight:700;color:var(--bt)}
.box2{padding:12px;margin-bottom:9px;border-radius:14px;background:var(--pn);line-height:1.6;font-size:.92rem}
.box2 button{margin:5px 5px 0 0}
.ach{opacity:.35}.ach.got{opacity:1;border-left:4px solid var(--bt)}
.sb{padding:6px 10px;border:0;border-radius:9px;background:var(--pn2);color:inherit;font:inherit;cursor:pointer}
ol{margin:8px 0 0 22px}
.fl{position:fixed;pointer-events:none;z-index:60;font-weight:700;font-size:1.3rem;color:var(--bt);text-shadow:0 2px 3px #000;animation:fl 1s ease-out forwards}
.cf{position:fixed;pointer-events:none;z-index:70;width:10px;height:14px;border-radius:2px}
#toasts{position:fixed;right:14px;bottom:56px;display:flex;flex-direction:column;gap:8px;z-index:90}
.toast{padding:9px 14px;border-radius:12px;background:var(--bt);color:var(--dk);font-weight:600;animation:sl .35s}
#modal{position:fixed;inset:0;display:none;place-items:center;background:#000b;z-index:100}#modal.on{display:grid}
.box{width:90%;max-width:420px;padding:26px;border-radius:22px;background:var(--pn);text-align:center;animation:pop .3s}
#gi{font-size:4rem}.box p{min-height:90px;line-height:1.5}
#gd{display:flex;justify-content:center;gap:6px;margin:10px 0 16px}#gd i{width:8px;height:8px;border-radius:50%;background:#fff4}#gd .on{background:var(--bt);transform:scale(1.4)}
.nav{display:flex;justify-content:space-between;align-items:center}#prev{border:0;background:none;color:inherit;font:inherit;cursor:pointer}
footer{margin-top:20px;padding:16px;text-align:center;background:#0a181c;border-top:3px solid var(--pn2);font-size:.95rem;color:#fff8eecc}
footer b{color:var(--bt);letter-spacing:.3px}
.tab{font-size:.74rem}.dec{position:absolute;left:0;right:0;top:122px;display:flex;justify-content:space-around;font-size:1.7rem;z-index:1;padding:0 16px;pointer-events:none}.dec span{animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 3px 0 #0003)}
.dqh{display:flex;justify-content:space-between;align-items:center}.dqb{height:8px;border-radius:8px;background:#0007;overflow:hidden;margin:5px 0}.dqb i{display:block;height:100%;background:var(--mt)}.dqd{border-left:4px solid var(--pk)}.dqd.fin{border-color:var(--bt);opacity:.6}
@keyframes bob{50%{transform:translateY(-5px)}}@keyframes pulse{50%{opacity:.7;transform:scale(1.03)}}
@keyframes pop{from{transform:scale(.4);opacity:0}}@keyframes walk{from{transform:translateX(-200px) scale(.7);opacity:0}}
@keyframes out{to{transform:translateY(-40px) scale(.5);opacity:0}}@keyframes bye{to{transform:translateX(160px);opacity:0}}
@keyframes shk{25%{transform:translateX(-3px) rotate(-4deg)}75%{transform:translateX(3px) rotate(4deg)}}
@keyframes fl{to{transform:translateY(-80px);opacity:0}}@keyframes sl{from{transform:translateX(120%)}}
@keyframes sq{50%{transform:scale(.9,1.1)}}@keyframes drift{from{left:-80px}to{left:110%}}
@media(max-width:900px){main{grid-template-columns:1fr}.panel{max-height:none}#cus{gap:4px}.cu{width:92px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style></head><body>
<header><h1>🥐 Toko Roti Manager</h1>
<div class="st"><span class="chip">🪙 <span id="co">0</span></span><span class="chip lv">⭐ Lv <span id="lv">1</span><div class="pt"><i id="xb"></i></div></span><span class="chip" id="skc">🔥 ×0</span><span class="chip" id="day">📅 Hari 1</span><span class="chip" id="stz" style="display:none">🌟 0</span></div>
<div><button class="ib" id="mus" title="Musik latar">🎵</button><button class="ib" id="snd">🔊</button><button class="ib" id="help">❓</button><button class="ib" id="reset">🗑️</button></div></header>
<div id="hint"></div>
<main><section>
<div id="scene"><div id="sky"><b id="sun">☀️</b><span class="cloud" style="top:30px">☁️</span><span class="cloud" style="top:80px;animation-delay:-30s">☁️</span></div>
<div id="wall"></div><div class="dec" id="dec"></div><div class="awn"></div><div id="sign">🥐 Toko Roti Manager</div><div id="ev" hidden></div><div id="cus"></div>
<div id="cnt"></div></div>
<h2>♨️ Dapur · tap oven untuk menguleni & mempercepat, ambil roti saat matang</h2><div id="ov"></div></section>
<aside><div class="tabs"><button class="tab on" data-p="pm">🥖 Menu</button><button class="tab" data-p="pu">⚡ Upgrade</button><button class="tab" data-p="pd">🛋️ Dekor</button><button class="tab" data-p="pa">🎯 Misi</button><button class="tab" data-p="pl">🏆 Peringkat</button></div>
<div class="panel on" id="pm"></div>
<div class="panel" id="pu"><div class="box2" id="prc"></div><div id="ul"></div></div>
<div class="panel" id="pd"></div><div class="panel" id="pa"></div>
<div class="panel" id="pl"><div class="box2"><div>Namamu: <b id="nm"></b></div><div id="ne"></div><button class="sb" id="rn">✏️ Ganti nama</button><button class="sb" id="rk">🔑 Kode simpan</button><ol id="tl"></ol></div><div class="box2" id="stt"></div></div>
</aside></main>
<footer>Dibuat dengan 🥐 &amp; ☕ oleh <b>Farel Bayone Meijabar</b><br><small>© 2026 Farel Bayone Meijabar · Semua hak dilindungi</small></footer>
<div id="toasts"></div>
<div id="modal"><div class="box"><div id="gi"></div><h2 id="gt"></h2><p id="gp"></p><div id="gd"></div><div class="nav"><button id="prev">← Kembali</button><button id="next" class="pri"></button></div></div></div>
<script>
const API='';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const BR=[
{id:'tawar',n:'Roti Tawar',e:'🍞',c:9,p:8,t:5,l:1},{id:'coklat',n:'Roti Coklat',e:'🍫',c:20,p:16,t:7,l:2},
{id:'croi',n:'Croissant',e:'🥐',c:36,p:28,t:9,l:3},{id:'donat',n:'Donat',e:'🍩',c:60,p:44,t:11,l:4},
{id:'bagel',n:'Bagel',e:'🥯',c:100,p:70,t:13,l:5},{id:'bague',n:'Baguette',e:'🥖',c:160,p:110,t:15,l:6},
{id:'pret',n:'Pretzel',e:'🥨',c:260,p:175,t:17,l:8},{id:'cup',n:'Cupcake',e:'🧁',c:420,p:280,t:19,l:10},
{id:'panc',n:'Pancake',e:'🥞',c:700,p:460,t:22,l:12},{id:'tart',n:'Pie Buah',e:'🥧',c:1200,p:780,t:25,l:14},
{id:'cake',n:'Kue Ulang Tahun',e:'🎂',c:2200,p:1400,t:30,l:17},{id:'mac',n:'Macaron',e:'🍡',c:4000,p:2600,t:34,l:20},
{id:'wed',n:'Kue Pengantin',e:'💒',c:9000,p:6000,t:40,l:25}];
const UP=[
{id:'oven',n:'Tambah Oven',i:'♨️',d:'+1 slot oven',b:120,g:2.4,m:6},
{id:'speed',n:'Oven Turbo',i:'⚡',d:'Panggang 10% lebih cepat',b:150,g:1.9,m:10},
{id:'batch',n:'Loyang Besar',i:'🍽️',d:'+1 roti per batch',b:400,g:2.6,m:4},
{id:'pat',n:'Kursi Nyaman',i:'🪑',d:'Pelanggan 20% lebih sabar',b:100,g:1.8,m:8},
{id:'mkt',n:'Promosi',i:'📣',d:'Pelanggan datang 15% lebih sering',b:200,g:1.8,m:10},
{id:'queue',n:'Perluas Toko',i:'🏬',d:'+1 kursi antrean (maks 7)',b:250,g:2,m:4},
{id:'price',n:'Display Cantik',i:'✨',d:'Harga jual +5%',b:300,g:1.9,m:10},
{id:'deco',n:'Dekorasi Toko',i:'🪴',d:'Tip & bonus kesabaran +4%',b:500,g:2.1,m:8},
{id:'auto',n:'Asisten Baker',i:'🧑‍🍳',d:'Memanggang & mengambil roti otomatis',b:900,g:1,m:1},
{id:'cash',n:'Kasir Handal',i:'💁',d:'Melayani pelanggan otomatis (lebih cepat tiap level)',b:1500,g:2.4,m:5}];
const AC=[
['🥐','Hari Pertama','Layani 1 pelanggan',s=>s.served>=1],['🧁','Pelanggan Tetap','Layani 50 pelanggan',s=>s.served>=50],
['🏪','Toko Ramai','Layani 300 pelanggan',s=>s.served>=300],['💰','Juragan','Raih 10K koin total',s=>s.earned>=1e4],
['💎','Sultan Roti','Raih 1M koin total',s=>s.earned>=1e6],['🔥','Panas Membara','Streak ×15',s=>s.best>=15],
['⭐','Master Baker','Capai Level 10',s=>L()>=10],['✋','Tepat Waktu','10 kali ambil roti sempurna',s=>s.perf>=10],
['🌟','Bintang Michelin','Buka cabang baru sekali',s=>s.stars>=1],['🧐','Disukai Kritikus','Puaskan 3 kritikus',s=>s.crit>=3]];
const EM=['🙂','😀','😎','🧑‍🦰','👵','👨‍🎓','👩‍💼','🧒','🧔','👩‍🍳','🧑‍🎤','👨‍🦳'];
const KEY='toko-roti-v2',rid=()=>crypto.randomUUID?crypto.randomUUID():'p'+Date.now()+Math.random().toString(36).slice(2);
const fresh=()=>({coin:60,xp:0,earned:0,life:0,served:0,stock:{},ovens:[null],up:{},seen:0,snd:1,t:0,day:1,dt:.1,stars:0,dec:{},dq:null,ds:0,mus:0,perf:0,crit:0,best:0,ach:{},name:'Baker'+(1000+Math.random()*9000|0),id:rid()});
let S;try{S={...fresh(),...JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('toko-roti'))}}catch(e){S=fresh()}
let C=[],streak=0,wipe=false,nextC=Date.now()+1500,lastT=Date.now(),lastL=0,cid=0,EV=null,nextEv=Date.now()+60000,nextCash=0;
const suf=['','K','M','B','T','Qa'];
function fmt(n){if(n<1000)return''+Math.floor(n);const i=Math.floor(Math.log10(n)/3);return i<suf.length?(n/10**(3*i)).toFixed(2)+suf[i]:n.toExponential(2)}
const L=()=>1+Math.floor(Math.sqrt(S.xp/12)),lb=l=>(l-1)**2*12;
const ul=id=>S.up[id]||0,stk=id=>S.stock[id]||0,unl=()=>BR.filter(b=>b.l<=L());
const mult=()=>(1+S.stars*.25+db('all'))*(EV&&EV.k=='fest'?2:1),bs=()=>3+ul('batch');
const bakeT=b=>b.t*1000*.9**ul('speed'),priceOf=b=>Math.round(b.p*(1+ul('price')*.05+db('price')));
const pat=()=>25000*(1+ul('pat')*.2+ul('deco')*.04+db('pat')),maxQ=()=>3+ul('queue');
const rate=()=>6000/(1+ul('mkt')*.15+db('mkt'))/(EV&&EV.k=='rush'?2.2:1),upCost=u=>Math.ceil(u.b*u.g**ul(u.id));
const fixOv=()=>{while(S.ovens.length<1+ul('oven'))S.ovens.push(null)};
const D=[{id:'plant',n:'Tanaman Hias',e:'🪴',c:300,k:'pat',v:.05,t:'Pelanggan 5% lebih sabar'},{id:'lamp',n:'Lampion Hangat',e:'🏮',c:900,k:'tip',v:.05,t:'Tip +5%'},
{id:'art',n:'Lukisan Roti',e:'🖼️',c:2500,k:'price',v:.05,t:'Harga jual +5%'},{id:'gram',n:'Radio Retro',e:'📻',c:6000,k:'mkt',v:.08,t:'Pelanggan datang 8% lebih sering'},
{id:'sofa',n:'Sofa Santai',e:'🛋️',c:15000,k:'pat',v:.1,t:'Pelanggan 10% lebih sabar'},{id:'fount',n:'Air Mancur',e:'⛲',c:40000,k:'price',v:.1,t:'Harga jual +10%'},
{id:'cat',n:'Kucing Hoki',e:'🐈',c:100000,k:'all',v:.15,t:'Semua pendapatan +15%'}];
const db=k=>D.filter(d=>S.dec[d.id]&&d.k==k).reduce((a,d)=>a+d.v,0);
let AX;function beep(f,d,v=.04,ty='triangle'){if(!S.snd)return;try{AX=AX||new AudioContext();const o=AX.createOscillator(),g=AX.createGain(),t=AX.currentTime;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AX.destination);o.start();o.stop(t+d)}catch(e){}}
const jingle=()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.25,.05),i*110));
function fx(txt,x,y,c){const e=document.createElement('div');e.className='fl';e.textContent=txt;if(c)e.style.color=c;e.style.left=x+'px';e.style.top=y+'px';document.body.append(e);setTimeout(()=>e.remove(),1000)}
function confetti(n=40){for(let i=0;i<n;i++){const e=document.createElement('i');e.className='cf';e.style.background=['#ffd36e','#ff6f91','#7ef0c6','#6ec3ff','#fff'][i%5];e.style.left=innerWidth/2+'px';e.style.top='30%';document.body.append(e);
 e.animate([{transform:'translate(0,0) rotate(0)'},{transform:`translate(${(Math.random()-.5)*innerWidth*.8}px,${200+Math.random()*400}px) rotate(${Math.random()*900}deg)`,opacity:0}],{duration:1400+Math.random()*900,easing:'cubic-bezier(.2,.8,.4,1)'}).onfinish=()=>e.remove()}}
function toast(i,t){const e=document.createElement('div');e.className='toast';e.textContent=i+' '+t;$('#toasts').append(e);setTimeout(()=>e.remove(),3400)}
const shake=r=>r.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'none'}],{duration:200});

/* ===== Pelanggan ===== */
function spawn(){
 const u=unl(),pick=()=>u[Math.floor(Math.random()**1.5*u.length)],vip=Math.random()<.12||(EV&&EV.k=='critic'&&!C.some(c=>c.crit)),crit=EV&&EV.k=='critic'&&!C.some(c=>c.crit);
 const o=[{b:pick(),q:Math.ceil(Math.random()*Math.min(3,1+Math.floor(L()/3)))}];
 if(L()>=4&&Math.random()<.35){const b2=pick();if(b2!=o[0].b)o.push({b:b2,q:1+(Math.random()<.4)})}
 const mul=(vip?2:1)*(crit?2:1),tot=o.reduce((a,x)=>a+priceOf(x.b)*x.q,0)*mul;
 const c={id:++cid,o,vip,crit,mul,tot,t0:Date.now(),pat:pat()*(crit?1.3:1)};
 const el=document.createElement('div');el.className='cu'+(vip?' vip':'');
 el.innerHTML=`<div class="fc">${crit?'🧐':vip?'🤩':EM[Math.random()*EM.length|0]}</div><div class="bb">${o.map(x=>x.b.e+'×'+x.q).join(' ')}</div><small>${crit?'🧐 Kritikus · ':vip?'⭐ VIP · ':''}🪙 ${fmt(tot)}</small><div class="pt"><i></i></div><button class="pri">Layani</button>`;
 c.el=el;c.bar=el.querySelector('i');c.btn=el.querySelector('button');c.btn.onclick=e=>serve(c,e);
 $('#cus').append(el);C.push(c);beep(700,.08,.03);if(crit)toast('🧐','Kritikus makanan datang! Layani dengan sempurna.');emptyMsg();upd()}
function drop(c,bad){C=C.filter(x=>x!=c);c.el.classList.add(bad?'bye':'out');setTimeout(()=>{c.el.remove();emptyMsg()},400)}
const can=c=>c.o.every(x=>stk(x.b.id)>=x.q);
function serve(c,e,auto){
 if(!can(c))return shake(c.el);
 c.o.forEach(x=>S.stock[x.b.id]-=x.q);streak++;S.best=Math.max(S.best,streak);
 const left=Math.max(0,1-(Date.now()-c.t0)/c.pat),pay=Math.round(c.tot*(1+left*.5+ul('deco')*.04+db('tip'))*(1+Math.min(streak,25)*.02)*mult());
 S.coin+=pay;S.earned+=pay;S.life+=pay;S.served++;dq('serve',1);dq('earn',pay);dq('streak',streak);S.xp+=c.mul*c.o.length;if(c.crit&&left>.3){S.crit++;confetti(30);toast('🧐','Kritikus memuji tokomu! Bonus!');S.coin+=pay;S.earned+=pay}
 const r=c.btn.getBoundingClientRect();fx('+'+fmt(pay)+' 🪙'+(left>.6?' 💖':''),r.left+r.width/2,r.top);
 beep(600+Math.min(streak,12)*30,.12);drop(c);upd()}
function emptyMsg(){const e=$('#cus .empty');if(!C.length&&!e)$('#cus').insertAdjacentHTML('afterbegin','<div class="empty">Menunggu pelanggan datang… 🚪</div>');if(C.length&&e)e.remove()}

/* ===== Oven & menu ===== */
function bake(b,silent){
 if(b.l>L())return;const i=S.ovens.indexOf(null);
 if(i<0){if(!silent)toast('♨️','Semua oven penuh. Tunggu atau beli oven baru.');return false}
 if(S.coin<b.c){if(!silent)toast('🪙','Uang untuk bahan kurang.');return false}
 const d=bakeT(b);S.coin-=b.c;S.ovens[i]={b:b.id,end:Date.now()+d,dur:d,n:bs()};dq('bake',1);beep(420,.1);upd();return true}
function collect(i,auto){const o=S.ovens[i],now=Date.now();if(!o)return;const b=BR.find(x=>x.id==o.b),el=$$('.ov')[i].getBoundingClientRect();
 if(now>o.end+9000){S.ovens[i]=null;fx('🔥 Gosong!',el.left+50,el.top,'#ff6f91');beep(150,.4,.06,'sawtooth');upd();return}
 const perf=!auto&&now<o.end+3000,n=o.n+(perf?1:0);S.stock[o.b]=stk(o.b)+n;S.ovens[i]=null;if(perf){S.perf++;dq('perf',1)}
 fx('+'+n+' '+b.e+(perf?' ✨':''),el.left+el.width/2,el.top);beep(perf?760:520,.15);upd()}
function renderOv(){fixOv();$('#ov').innerHTML=S.ovens.map((_,i)=>`<div class="ov" data-o="${i}"><span class="oe">♨️</span><span class="ot">Kosong</span><div class="pt"><i style="width:0"></i></div></div>`).join('')}
$('#ov').addEventListener('click',e=>{const r=e.target.closest('[data-o]');if(!r)return;const i=+r.dataset.o,o=S.ovens[i],now=Date.now();
 if(!o)return;if(now>=o.end)return collect(i);o.end-=700;r.classList.remove('kn');void r.offsetWidth;r.classList.add('kn');beep(300+Math.random()*100,.05);fx('👐',e.clientX,e.clientY)});
function buildLists(){
 $('#pm').innerHTML=BR.map(b=>`<button class="row" data-m="${b.id}"><span class="ic">${b.e}</span><span><b>${b.n}</b> <em class="n"></em><small></small></span><span class="cost">🪙 ${fmt(b.c)}</span></button>`).join('');
 $('#ul').innerHTML=UP.map(u=>`<button class="row" data-u="${u.id}"><span class="ic">${u.i}</span><span><b>${u.n}</b> <em class="n"></em><small>${u.d}</small></span><span class="cost"></span></button>`).join('');
 $('#pd').innerHTML=D.map(d=>`<button class="row" data-d="${d.id}"><span class="ic">${d.e}</span><span><b>${d.n}</b> <em class="n"></em><small>${d.t}</small></span><span class="cost">🪙 ${fmt(d.c)}</span></button>`).join('')+'<div class="box2"><small>Dekorasi permanen: tidak hilang saat buka cabang baru.</small></div>';
 $('#pa').innerHTML='<div id="dq"></div>'+AC.map((a,i)=>`<div class="box2 ach" data-a="${i}">${a[0]} <b>${a[1]}</b><br><small>${a[2]}</small></div>`).join('')}
$('#pm').addEventListener('click',e=>{const r=e.target.closest('[data-m]');if(!r)return;const b=BR.find(x=>x.id==r.dataset.m);if(b.l>L())return shake(r);if(!bake(b))shake(r)});
$('#pu').addEventListener('click',e=>{if(e.target.id=='pr')return prestige();const r=e.target.closest('[data-u]');if(!r)return;const u=UP.find(x=>x.id==r.dataset.u),c=upCost(u);
 if(ul(u.id)>=u.m||S.coin<c)return shake(r);S.coin-=c;S.up[u.id]=ul(u.id)+1;fixOv();renderOv();beep(660,.15);toast('⚡',u.n+' ditingkatkan!');upd()});
$$('.tab').forEach(t=>t.onclick=()=>{$$('.tab,.panel').forEach(e=>e.classList.remove('on'));t.classList.add('on');$('#'+t.dataset.p).classList.add('on');if(t.dataset.p=='pl')sync()});
const gain=()=>Math.floor(Math.sqrt(S.earned/8000));
function prestige(){const g=gain();if(g<1)return;if(!confirm(`Buka cabang baru? Koin & upgrade direset, tapi kamu dapat +${g} 🌟 (bonus +${g*25}% pendapatan permanen). Level tetap.`))return;
 S.stars+=g;Object.assign(S,{coin:60,earned:0,stock:{},ovens:[null],up:{}});C.slice().forEach(c=>drop(c));fixOv();renderOv();confetti(90);jingle();toast('🌟','Cabang baru dibuka! +'+g+' bintang');upd()}
function hint(){
 const baking=S.ovens.some(Boolean),has=BR.some(b=>stk(b.id)>0);
 if(!S.served)return has?'🙋 Roti siap! Klik Layani pada pelanggan di etalase.':baking?'⏳ Tap oven untuk menguleni dan mempercepat matangnya!':'🥖 Mulai: klik Roti Tawar di tab Menu untuk memanggang satu batch.';
 if(S.ovens.some(o=>o&&Date.now()>=o.end))return '🔔 Roti matang! Tap oven sekarang. Cepat = bonus ✨, telat = gosong.';
 if(C.some(c=>!can(c)))return '😟 Ada pesanan yang stoknya kurang. Panggang sekarang!';
 if(UP.some(u=>ul(u.id)<u.m&&S.coin>=upCost(u)))return '⚡ Uangmu cukup untuk upgrade baru di tab Upgrade.';
 if(gain()>=1)return '🌟 Kamu bisa buka cabang baru di tab Upgrade untuk bonus permanen!';
 return '🔥 Layani cepat tanpa ada yang kecewa untuk streak hingga +50%.'}

function upd(){
 fixOv();const l=L();
 if(lastL&&l>lastL){const n=BR.find(b=>b.l==l);toast('⭐','Level '+l+(n?' · Menu baru: '+n.n+' '+n.e:''));jingle();confetti(35)}lastL=l;
 BR.forEach(b=>{const r=$(`[data-m=${b.id}]`),lock=b.l>l;r.classList.toggle('lock',lock);r.classList.toggle('ok',!lock&&S.coin>=b.c&&S.ovens.includes(null));
  r.querySelector('.n').textContent=lock?'🔒 Level '+b.l:'stok '+stk(b.id);r.querySelector('small').textContent=lock?'Naik level dengan melayani pelanggan':`jual ${fmt(priceOf(b))} · ${Math.round(bakeT(b)/1000)} dtk · isi ${bs()}`});
 UP.forEach(u=>{const r=$(`[data-u=${u.id}]`),v=ul(u.id),mx=v>=u.m,c=upCost(u);r.classList.toggle('ok',!mx&&S.coin>=c);r.querySelector('.n').textContent=u.m>1?`Lv ${v}/${u.m}`:(v?'✔':'');r.querySelector('.cost').textContent=mx?'MAX':'🪙 '+fmt(c)});
 const g=gain();$('#prc').innerHTML=`🌟 <b>Cabang Baru</b> · bintang: ${S.stars} (+${S.stars*25}% pendapatan)<br><small>Pendapatan putaran ini ${fmt(S.earned)} 🪙 → ${g>0?'dapat +'+g+' 🌟':'butuh 8K untuk bintang pertama'}</small><br><button class="pri" id="pr" ${g<1?'disabled':''}>Buka cabang baru</button>`;
 $('#stz').style.display=S.stars?'':'none';$('#stz').textContent='🌟 '+S.stars;
 AC.forEach((a,i)=>{if(!S.ach[i]&&a[3](S)){S.ach[i]=1;toast(a[0],'Prestasi: '+a[1]);confetti(25);jingle()}$(`[data-a="${i}"]`).classList.toggle('got',!!S.ach[i])});
 if(ul('auto'))S.ovens.forEach((o,i)=>{if(o&&Date.now()>=o.end)collect(i,1)});
 if(ul('auto')&&S.ovens.includes(null)){const pend=id=>S.ovens.filter(o=>o&&o.b==id).reduce((a,o)=>a+o.n,0);
  const need=id=>C.reduce((a,c)=>a+c.o.filter(x=>x.b.id==id).reduce((s,x)=>s+x.q,0),0);
  const cand=unl().filter(b=>S.coin>=b.c&&stk(b.id)+pend(b.id)<Math.max(6,need(b.id)+2)).sort((a,b)=>(stk(a.id)+pend(a.id)-need(a.id))-(stk(b.id)+pend(b.id)-need(b.id))||b.p-a.p)[0];if(cand)bake(cand,true)}
 C.forEach(c=>{const ok=can(c);c.btn.disabled=!ok;c.btn.textContent=ok?'Layani':'Stok kurang'});
 renderDQ();decUI();$('#hint').textContent=hint();document.title=fmt(S.coin)+' 🪙 · Toko Roti'}

function sky(){const t=S.dt,h=t<.5?200:t<.7?25:240,l=t<.5?65:t<.7?55:14;$('#scene').style.background=`linear-gradient(${`hsl(${h},75%,${l}%)`},hsl(${h-15},80%,${Math.min(l+18,85)}%))`;
 $('#sun').style.transform=`translate(${t*($('#scene').clientWidth-50)}px,${Math.sin(t*Math.PI)*-100+120}px)`;$('#sun').textContent=t<.7?'☀️':'🌙'}
function events(now){
 if(EV&&now>EV.end){EV=null;$('#ev').hidden=true}
 if(!EV&&now>nextEv&&C.length<maxQ()){const k=['rush','fest','critic'][Math.random()*3|0];if(k=='critic'&&L()<3)return;
  EV={k,end:now+(k=='critic'?1:25000)};nextEv=now+70000+Math.random()*50000;
  const m={rush:['🚌','Jam sibuk! Pelanggan membludak'],fest:['🎉','Festival roti! Pendapatan ×2'],critic:['🧐','Kritikus makanan datang!']}[k];toast(m[0],m[1]);
  const ev=$('#ev');ev.hidden=false;ev.textContent=m[0]+' '+m[1];if(k=='critic'){spawn();setTimeout(()=>{EV=null;ev.hidden=true},4000);EV.end=now+4000}}}
function tick(){
 const now=Date.now(),gap=now-lastT;lastT=now;
 if(gap>1500){C.forEach(c=>c.t0+=gap);nextC+=gap;nextEv+=gap;S.ovens.forEach(o=>{if(o){o.end+=gap}})}
 S.dt+=gap/150000;if(S.dt>=1){S.dt=0;S.day++;toast('📅','Hari '+S.day+' dimulai!');$('#day').textContent='📅 Hari '+S.day}
 events(now);
 let ch=0;S.ovens.forEach((o,i)=>{if(o&&now>=o.end+9000){collect(i,1);ch=1}});
 $$('.ov').forEach((el,i)=>{const o=S.ovens[i];if(!o){el.className='ov';el.querySelector('.oe').textContent='♨️';el.querySelector('.ot').textContent='Kosong';el.querySelector('i').style.width='0';return}
  const done=now>=o.end;el.className='ov'+(done?' dn':' on');el.querySelector('.oe').textContent=done?BR.find(b=>b.id==o.b).e:'🔥';
  el.querySelector('.ot').textContent=done?'Ambil! ('+Math.max(0,Math.ceil((o.end+9000-now)/1000))+'s)':Math.ceil((o.end-now)/1000)+' dtk · tap!';
  el.querySelector('i').style.width=done?(1-(now-o.end)/9000)*100+'%':(1-(o.end-now)/o.dur)*100+'%';el.querySelector('i').classList.toggle('lo',done)});
 if(S.ovens.some(o=>o&&now>=o.end&&!o.ring)){S.ovens.forEach(o=>{if(o&&now>=o.end&&!o.ring){o.ring=1;beep(900,.2,.05);ch=1}})}
 C.slice().forEach(c=>{const p=(now-c.t0)/c.pat;c.bar.style.width=Math.max(0,1-p)*100+'%';c.bar.classList.toggle('lo',p>.7);c.el.classList.toggle('mad',p>.8);
  if(p>=1){streak=0;toast('😞','Pelanggan pergi kecewa. Streak hilang.');drop(c,1);ch=1}});
 if(ul('cash')&&now>nextCash){const c=C.find(can);if(c)serve(c,null,1);nextCash=now+9000/(1+ul('cash')*.6)}
 if(C.length<maxQ()&&now>nextC){spawn();nextC=now+rate()*(.6+Math.random()*.8)}
 const l=L(),a=lb(l),b=lb(l+1);
 $('#co').textContent=fmt(S.coin);$('#lv').textContent=l;$('#xb').style.width=(S.xp-a)/(b-a)*100+'%';
 $('#skc').textContent='🔥 ×'+streak+(streak?` (+${Math.min(streak,25)*2}%)`:'');sky();$('#day').textContent='📅 Hari '+S.day;
 $('#cnt').innerHTML=BR.filter(b=>stk(b.id)>0).map(b=>`<span title="${b.n}">${b.e}<small style="font-size:.7rem;color:#fff">${stk(b.id)}</small></span>`).join('')||'<small>Etalase kosong. Panggang dulu!</small>';
 if(ch)upd();requestAnimationFrame(tick)}

/* ===== Dekorasi, misi harian, musik ===== */
function renderDec(){$('#dec').innerHTML=D.filter(d=>S.dec[d.id]).map((d,i)=>`<span style="animation-delay:${-i*.5}s">${d.e}</span>`).join('')}
function decUI(){D.forEach(d=>{const r=$(`[data-d=${d.id}]`),own=S.dec[d.id];r.classList.toggle('ok',!own&&S.coin>=d.c);r.querySelector('.n').textContent=own?'✔ terpasang':'';r.querySelector('.cost').textContent=own?'':'🪙 '+fmt(d.c)})}
$('#pd').addEventListener('click',e=>{const r=e.target.closest('[data-d]');if(!r)return;const d=D.find(x=>x.id==r.dataset.d);if(S.dec[d.id]||S.coin<d.c)return shake(r);
 S.coin-=d.c;S.dec[d.id]=1;renderDec();beep(700,.2);confetti(20);toast(d.e,d.n+' terpasang! '+d.t);upd()});
const today=()=>new Date().toISOString().slice(0,10);
function ensureDQ(){const t=today();if(S.dq&&S.dq.d==t)return;const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
 if(!(S.dq&&S.dq.d==y&&S.dq.q.every(x=>x.c)))S.ds=0;
 let a=0;for(const ch of t)a=a*31+ch.charCodeAt(0)|0;const rg=()=>{a|=0;a=a+0x6D2B79F5|0;let x=Math.imul(a^a>>>15,1|a);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296};
 const l=L(),P=[['serve',()=>8+(rg()*10|0),'Layani {n} pelanggan'],['earn',()=>Math.round((250+rg()*300)*l/10)*10+200,'Hasilkan {n} koin'],['perf',()=>3+(rg()*4|0),'Ambil {n} roti sempurna ✨'],['bake',()=>6+(rg()*6|0),'Panggang {n} batch'],['streak',()=>6+(rg()*6|0),'Capai streak ×{n}']];
 const pk=P.sort(()=>rg()-.5).slice(0,3).map((x,i)=>{const n=x[1]();return{k:x[0],n,p:0,c:0,t:x[2].replace('{n}',fmt(n)),r:Math.round((150+60*l)*(1+i*.4))}});
 S.dq={d:t,q:pk}}
function dq(k,n){if(!S.dq)return;S.dq.q.forEach(x=>{if(x.k==k&&!x.c)x.p=k=='streak'?Math.max(x.p,n):x.p+n})}
function renderDQ(){ensureDQ();const q=S.dq.q;if(!$('#dq'))return;
 $('#dq').innerHTML=`<div class="box2"><div class="dqh"><b>🎯 Misi Harian</b><span class="chip">🔥 ${S.ds} hari beruntun</span></div><small>Berganti setiap hari. Selesaikan ketiganya untuk bonus beruntun!</small></div>`+
 q.map((x,i)=>{const ok=x.p>=x.n;return`<div class="box2 dqd${x.c?' fin':''}"><div class="dqh"><span>${x.t}</span><b>🪙 ${fmt(x.r)}</b></div><div class="dqb"><i style="width:${Math.min(100,x.p/x.n*100)}%"></i></div><div class="dqh"><small>${fmt(Math.min(x.p,x.n))} / ${fmt(x.n)}</small>${x.c?'<small>✔ Diambil</small>':`<button class="pri" data-q="${i}" ${ok?'':'disabled'}>Ambil hadiah</button>`}</div></div>`}).join('')}
$('#pa').addEventListener('click',e=>{const b=e.target.closest('[data-q]');if(!b)return;const x=S.dq.q[+b.dataset.q];if(x.c||x.p<x.n)return;x.c=1;S.coin+=x.r;S.earned+=x.r;S.life+=x.r;
 const r=b.getBoundingClientRect();fx('+'+fmt(x.r)+' 🪙',r.left+40,r.top);jingle();
 if(S.dq.q.every(y=>y.c)){S.ds++;const bn=Math.round((200+80*L())*Math.min(S.ds,7));S.coin+=bn;S.earned+=bn;S.life+=bn;confetti(70);toast('🎯','Semua misi selesai! Bonus beruntun +'+fmt(bn)+' 🪙')}upd()});
const SC=[0,2,4,7,9];let ms=0;
function mnote(f,d,v){if(!AX)return;try{const o=AX.createOscillator(),g=AX.createGain(),t=AX.currentTime;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AX.destination);o.start();o.stop(t+d)}catch(e){}}
function musStep(){if(!S.mus||!AX)return;const night=S.dt>=.7,base=night?174.6:261.6,ch=SC[(ms>>2)%5];
 if(ms%4==0){mnote(base/2*2**(ch/12),2,.035);mnote(base*2**((ch+4)/12),1.8,.015)}
 if(Math.random()<.75)mnote(base*2*2**((SC[Math.random()*5|0]+(Math.random()<.3?12:0))/12),1,.03);ms++}
const musUI=()=>{$('#mus').textContent=S.mus?'🎵':'🔈';$('#mus').style.opacity=S.mus?1:.55};
$('#mus').onclick=()=>{S.mus=S.mus?0:1;if(S.mus){AX=AX||new AudioContext();AX.resume()}musUI();save()};
addEventListener('pointerdown',()=>{if(S.mus&&!AX){AX=new AudioContext()}},{once:true});setInterval(musStep,480);
/* ===== Backend (opsional) ===== */
const api=async(p,o)=>{if(!API)throw 0;const r=await fetch(API+p,o);if(!r.ok)throw 0;return r.json()};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function renderTop(t){$('#ne').textContent=API?'':'Backend belum diatur (lihat README). Game tetap jalan offline.';
 $('#tl').innerHTML=(t||[]).map(x=>`<li${x.name==S.name?' style="color:var(--bt)"':''}>${esc(x.name)} · 🪙 ${fmt(x.score)}</li>`).join('');
 $('#stt').innerHTML=`📊 Pelanggan dilayani: <b>${S.served}</b><br>🔥 Streak terbaik: <b>${S.best}</b><br>💰 Total pendapatan: <b>${fmt(S.life)}</b><br>✨ Roti sempurna: <b>${S.perf}</b><br>🏅 Prestasi: <b>${Object.keys(S.ach).length}/${AC.length}</b>`}
function sync(){$('#nm').textContent=S.name;if(!API)return renderTop([]);save();
 api('/save/'+S.id,{method:'PUT',body:JSON.stringify(S)}).catch(()=>{});
 api('/score',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:S.id,name:S.name,score:S.life})}).then(renderTop).catch(()=>api('/top').then(renderTop).catch(()=>{}))}
async function cloud(){try{const r=await api('/save/'+S.id);if(r&&r.t>S.t){Object.assign(S,r,{id:S.id});renderOv();upd()}}catch(e){}}
$('#rn').onclick=()=>{const n=prompt('Nama baru (maks 16 huruf):',S.name);if(n&&n.trim()){S.name=n.trim().slice(0,16);sync()}};
$('#rk').onclick=()=>{const k=prompt('Kode simpanmu (salin untuk main di perangkat lain). Tempel kode lain untuk memuat progres itu:',S.id);
 if(k&&k.trim()!=S.id&&/^[\w-]{8,40}$/.test(k.trim())){S.id=k.trim();S.t=0;save();location.reload()}};

/* ===== Panduan ===== */
const G=[['🥐','Selamat datang, Manajer!','Kelola toko rotimu dari hari ke hari. Layani pelanggan, naik level, buka menu baru, dan tumbuh jadi imperium roti!'],
['♨️','Panggang & uleni','Klik roti di tab Menu untuk memanggang. Tap oven saat memanggang untuk menguleni dan mempercepat. Begitu matang, tap lagi dalam 3 detik untuk roti bonus ✨. Jangan telat: lewat 9 detik rotimu gosong!'],
['🙋','Layani pelanggan','Pesanan bisa lebih dari satu jenis. Layani sebelum sabar habis untuk tip besar, rangkai streak 🔥, dan sambut VIP ⭐ serta kritikus 🧐 yang membayar berlipat.'],
['⚡','Upgrade & staf','Beli oven, loyang besar, dekorasi, Asisten Baker, dan Kasir Handal yang melayani otomatis. Waspadai jam sibuk dan nikmati festival roti ×2.'],
['🌟','Cabang baru','Setelah cukup kaya, buka cabang baru: upgrade direset, tapi kamu dapat bintang untuk bonus pendapatan permanen. Progres tersimpan otomatis tanpa login.']];
let gi=0;
function showG(i){gi=i;const g=G[i];$('#gi').textContent=g[0];$('#gt').textContent=g[1];$('#gp').textContent=g[2];
 $('#gd').innerHTML=G.map((_,k)=>`<i class="${k==i?'on':''}"></i>`).join('');$('#prev').style.visibility=i?'visible':'hidden';$('#next').textContent=i==G.length-1?'Buka toko! 🥐':'Lanjut →'}
const closeG=()=>{$('#modal').classList.remove('on');S.seen=1;save()};
$('#next').onclick=()=>gi<G.length-1?showG(gi+1):closeG();$('#prev').onclick=()=>showG(gi-1);
$('#modal').onclick=e=>{if(e.target.id=='modal')closeG()};
$('#help').onclick=()=>{showG(0);$('#modal').classList.add('on')};
$('#snd').onclick=()=>{S.snd=S.snd?0:1;$('#snd').textContent=S.snd?'🔊':'🔇'};
$('#reset').onclick=()=>{if(confirm('Hapus semua progres? Ini tidak bisa dibatalkan.')){wipe=true;localStorage.removeItem(KEY);location.reload()}};
function save(){if(wipe)return;S.t=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
setInterval(save,8000);setInterval(()=>{if(API)sync()},45000);addEventListener('beforeunload',save);
buildLists();ensureDQ();renderDec();musUI();renderOv();$('#snd').textContent=S.snd?'🔊':'🔇';$('#nm').textContent=S.name;renderTop([]);
if(!S.seen){showG(0);$('#modal').classList.add('on')}
emptyMsg();upd();cloud();if(API)api('/top').then(renderTop).catch(()=>{});requestAnimationFrame(tick);
</script></body></html>
